name: tmp-pr16239-cache-test

on:
  push:
    branches:
      - mirror/pr16239-cache-hardening-20260911

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted unit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -r tests-unit/requirements.txt
      - name: Run attention-measure unit tests
        run: |
          python -m pytest -q \
            tests-unit/comfy_test/attention_measure_test.py \
            tests-unit/comfy_test/sparse_attention_measure_cache_test.py
